name: Build Signed APK v2

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Set app version to 2.0
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text()

          import re

          text, code_count = re.subn(
              r'(?m)^\s*versionCode\s+\d+\s*$',
              '        versionCode 2',
              text,
              count=1
          )

          text, name_count = re.subn(
              r'(?m)^\s*versionName\s+"[^"]*"\s*$',
              '        versionName "2.0"',
              text,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  f"Could not safely update version (versionCode matches={code_count}, versionName matches={name_count})"
              )

          path.write_text(text)
          PY

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          cp "$APK" "hojoom-v2.0.apk"

      # Keep the normal Artifact as a backup.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hojoom-v2.0-apk
          path: hojoom-v2.0.apk

      # Only publish a Release when you manually run this workflow.
      # The unique tag prevents later manual builds from colliding with an old Release.
      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0-build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" "hojoom-v2.0.apk"             --title "هجوم نسخه 2.0"             --notes "نسخه 2.0 بازی هجوم"             --latest
